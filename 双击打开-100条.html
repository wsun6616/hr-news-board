<script>
const hrChannels = [
  {id:'practical', name:'社保医保实务'},
  {id:'cases', name:'劳动争议案例'},
  {id:'policy', name:'政策法规'},
  {id:'market', name:'招聘市场'}
];
const investChannels = [
  {id:'macro', name:'宏观利率'},
  {id:'usstock', name:'全球股市'},
  {id:'bond', name:'债券市场'},
  {id:'metals', name:'贵金属与铜'},
  {id:'commodity', name:'大宗商品'},
  {id:'fund', name:'基金产品'},
  {id:'industry', name:'产业科技'},
  {id:'trade', name:'国际贸易'}
];
const globalChannels = [
  {id:'gbank', name:'央行利率'},
  {id:'gstocks', name:'海外股市'},
  {id:'gcommodities', name:'大宗商品'},
  {id:'gtech', name:'科技产业'},
  {id:'gcompany', name:'公司商业'},
  {id:'gmacro', name:'全球宏观'}
];
const state = {
  view:'hr', active:'all', error:'',
  hrItems:[], hrUpdatedAt:'',
  investItems:[], quotes:[], investUpdatedAt:'',
  globalItems:[], globalUpdatedAt:'',
  historyItems:[], dates:[], selectedDate:''
};
const readLinks = JSON.parse(localStorage.getItem('hr_online_read') || '[]');
let favoriteLinks = JSON.parse(localStorage.getItem('hr_online_favorites') || '[]');

function currentChannels(){
  if(state.view === 'invest') return investChannels;
  if(state.view === 'global') return globalChannels;
  return hrChannels;
}
function currentItems(){
  if(state.view === 'invest') return state.investItems;
  if(state.view === 'global') return state.globalItems;
  if(state.view === 'history') return state.historyItems;
  return state.hrItems;
}
function formatTime(value){
  if(!value) return '未知';
  const d = new Date(value);
  return isNaN(d.getTime()) ? value : d.toLocaleString('zh-CN',{hour12:false});
}
function setUpdatedText(){
  const count = currentItems().length;
  const updated = state.view === 'invest'
    ? state.investUpdatedAt
    : state.view === 'global'
      ? state.globalUpdatedAt
      : state.hrUpdatedAt;
  document.getElementById('updatedAt').textContent = `数据更新时间：${formatTime(updated)}；当前共 ${count} 条`;
}
function renderViewTabs(){
  document.querySelectorAll('.view-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.view === state.view));
}
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  if(state.view === 'history') return;
  const tabs = [{id:'all',name:'全部'}, ...currentChannels()];
  tabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (state.active === tab.id ? ' active' : '');
    btn.textContent = tab.name;
    btn.onclick = () => {state.active = tab.id; render();};
    el.appendChild(btn);
  });
}
function markRead(link){
  if(!readLinks.includes(link)){
    readLinks.push(link);
    localStorage.setItem('hr_online_read', JSON.stringify(readLinks));
  }
}
function toggleFavorite(link, btn){
  if(favoriteLinks.includes(link)) favoriteLinks = favoriteLinks.filter(x => x !== link);
  else favoriteLinks.push(link);
  localStorage.setItem('hr_online_favorites', JSON.stringify(favoriteLinks));
  btn.textContent = favoriteLinks.includes(link) ? '★' : '☆';
  btn.classList.toggle('active', favoriteLinks.includes(link));
}
function getFilteredItems(){
  const keyword = document.getElementById('keyword').value.trim().toLowerCase();
  return currentItems().filter(item => {
    const matchTab = state.active === 'all' || item.channelId === state.active;
    const text = `${item.title} ${item.description} ${item.source}`.toLowerCase();
    return matchTab && (!keyword || text.includes(keyword));
  });
}
function renderQuoteGrid(){
  if(state.view !== 'invest' || !state.quotes.length) return null;
  const grid = document.createElement('div');
  grid.className = 'quote-grid';
  state.quotes.forEach(q => {
    const pctClass = q.changePercent > 0 ? 'up' : q.changePercent < 0 ? 'down' : 'flat';
    const card = document.createElement('div');
    card.className = 'quote-card';
    card.innerHTML = `
      <div class="name">${q.name}</div>
      <div class="price">${q.price ?? '--'}</div>
      <div class="${pctClass}">${q.change ?? '--'} / ${q.changePercent ?? '--'}%</div>
      <div class="sub">高：${q.high ?? '--'}　低：${q.low ?? '--'}<br>${q.time || ''}</div>`;
    grid.appendChild(card);
  });
  return grid;
}
function renderCards(items){
  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card' + (readLinks.includes(item.link) ? ' read' : '');

    const top = document.createElement('div');
    top.className = 'card-top';
    const left = document.createElement('div');
    const tag = document.createElement('span');
    tag.className = `tag tag-${item.channelId}`;
    tag.textContent = item.channelName;
    const source = document.createElement('span');
    source.className = 'source';
    source.textContent = item.source;
    left.append(tag, document.createTextNode(' '), source);
    const star = document.createElement('button');
    star.className = 'star' + (favoriteLinks.includes(item.link) ? ' active' : '');
    star.textContent = favoriteLinks.includes(item.link) ? '★' : '☆';
    star.onclick = () => toggleFavorite(item.link, star);
    top.append(left, star);

    const title = document.createElement('h2');
    const titleLink = document.createElement('a');
    titleLink.href = item.link;
    titleLink.target = '_blank';
    titleLink.rel = 'noopener';
    titleLink.textContent = item.title;
    titleLink.onclick = () => {markRead(item.link); card.classList.add('read');};
    title.appendChild(titleLink);

    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = item.description || '暂无摘要，请查看原文。';

    const foot = document.createElement('div');
    foot.className = 'foot';
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = item.pubDate || '时间未知';
    const open = document.createElement('a');
    open.className = 'open';
    open.href = item.link;
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = '查看原文';
    open.onclick = () => {markRead(item.link); card.classList.add('read');};
    foot.append(time, open);

    card.append(top,title,desc,foot);
    grid.appendChild(card);
  });
  return grid;
}
function renderHistoryBar(){
  const bar = document.createElement('div');
  bar.className = 'history-bar';
  const select = document.createElement('select');
  select.id = 'dateSelect';
  if(!state.dates.length){
    const option = document.createElement('option');
    option.textContent = '暂无历史日期';
    select.appendChild(option);
  }else{
    state.dates.forEach(d => {
      const option = document.createElement('option');
      option.value = d.path;
      option.textContent = `${d.date}（${d.count}条）`;
      if(d.date === state.selectedDate) option.selected = true;
      select.appendChild(option);
    });
  }
  select.onchange = () => loadDaily(select.value);
  const tip = document.createElement('div');
  tip.className = 'source';
  tip.textContent = '历史文件按日期保存；若某天定时任务未运行，则该日期可能缺失。';
  bar.append(select,tip);
  return bar;
}
function render(){
  renderViewTabs();
  renderTabs();
  setUpdatedText();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(state.error) content.appendChild(Object.assign(document.createElement('div'),{className:'notice',textContent:state.error}));
  if(state.view === 'history') content.appendChild(renderHistoryBar());
  const quoteGrid = renderQuoteGrid();
  if(quoteGrid) content.appendChild(quoteGrid);
  if(state.view === 'invest'){
    content.appendChild(Object.assign(document.createElement('div'),{
      className:'notice',
      textContent:'资讯和行情来自公开数据源，免费版为定时更新，非交易所级实时行情；仅供参考，不构成投资建议。'
    }));
  }
  if(state.view === 'global'){
    content.appendChild(Object.assign(document.createElement('div'),{
      className:'notice',
      textContent:'国际资讯来自公开RSS或公开新闻聚合，部分原文可能受地域、登录或付费墙限制；仅供参考，不构成投资建议。'
    }));
  }
  const items = getFilteredItems();
  document.getElementById('meta').textContent = `当前显示 ${items.length} 条；已读 ${readLinks.length} 条，收藏 ${favoriteLinks.length} 条。`;
  if(!items.length){
    content.appendChild(Object.assign(document.createElement('div'),{className:'empty',textContent:'暂无匹配内容。'}));
    return;
  }
  content.appendChild(renderCards(items));
}
function applyHrPayload(data){
  state.hrItems = data.items || [];
  state.hrUpdatedAt = data.updatedAt || '';
}
function applyInvestPayload(data){
  state.investItems = data.items || [];
  state.quotes = data.quotes || [];
  state.investUpdatedAt = data.updatedAt || '';
}
function applyGlobalPayload(data){
  state.globalItems = data.items || [];
  state.globalUpdatedAt = data.updatedAt || '';
}
async function loadHr(){
  try{
    const response = await fetch(`data/latest.json?t=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`数据文件读取失败：${response.status}`);
    applyHrPayload(await response.json());
    return false;
  }catch(error){
    if(window.INLINE_HR_DATA && window.INLINE_HR_DATA.items){
      applyHrPayload(window.INLINE_HR_DATA);
      return true;
    }
    state.error = `暂时无法读取HR数据：${error.message}`;
    return false;
  }
}
async function loadInvest(){
  try{
    const response = await fetch(`data/invest.json?t=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`投资数据读取失败：${response.status}`);
    applyInvestPayload(await response.json());
    return false;
  }catch(error){
    if(window.INLINE_INVEST_DATA && window.INLINE_INVEST_DATA.items){
      applyInvestPayload(window.INLINE_INVEST_DATA);
      return true;
    }
    state.error = `暂时无法读取投资数据：${error.message}`;
    return false;
  }
}
async function loadGlobal(){
  try{
    const response = await fetch(`data/global.json?t=${Date.now()}`, {cache:'no-store'});
    if(!response.ok) throw new Error(`国际数据读取失败：${response.status}`);
    applyGlobalPayload(await response.json());
    return false;
  }catch(error){
    if(window.INLINE_GLOBAL_DATA && window.INLINE_GLOBAL_DATA.items){
      applyGlobalPayload(window.INLINE_GLOBAL_DATA);
      return true;
    }
    state.error = `暂时无法读取国际数据：${error.message}`;
    return false;
  }
}
async function loadHistoryIndex(){
  const response = await fetch(`data/daily/index.json?t=${Date.now()}`, {cache:'no-store'});
  if(!response.ok) throw new Error(`历史索引读取失败：${response.status}`);
  const data = await response.json();
  state.dates = data.dates || [];
  if(state.dates.length && !state.selectedDate) state.selectedDate = state.dates[0].date;
  if(state.dates.length){
    const selected = state.dates.find(d => d.date === state.selectedDate) || state.dates[0];
    await loadDaily(selected.path);
  }else state.historyItems = [];
}
async function loadDaily(path){
  const response = await fetch(`${path}?t=${Date.now()}`, {cache:'no-store'});
  if(!response.ok) throw new Error(`历史数据读取失败：${response.status}`);
  const data = await response.json();
  state.historyItems = data.items || [];
  state.selectedDate = data.date || '';
  render();
}
async function loadData(){
  state.error = '';
  if(state.view === 'history'){
    try{await loadHistoryIndex();}catch(error){state.error = error.message;}
  }else{
    const [hrOffline, investOffline, globalOffline] = await Promise.all([loadHr(), loadInvest(), loadGlobal()]);
    if(state.view === 'hr' && hrOffline){
      state.error = '当前为本地直接打开模式，已显示内置HR数据；部署到GitHub后会自动读取在线最新数据。';
    }
    if(state.view === 'invest' && investOffline){
      state.error = '当前为本地直接打开模式，已显示内置投资数据；部署到GitHub后会自动读取在线最新数据。';
    }
    if(state.view === 'global' && globalOffline){
      state.error = '当前为本地直接打开模式，已显示内置国际数据；部署到GitHub后会自动读取在线最新数据。';
    }
  }
  render();
}
function switchView(view){
  state.view = view;
  state.active = 'all';
  document.getElementById('keyword').value = '';
  loadData();
}
document.querySelectorAll('.view-tab').forEach(btn => btn.onclick = () => switchView(btn.dataset.view));
document.getElementById('keyword').addEventListener('input', render);
document.getElementById('reloadBtn').addEventListener('click', loadData);
loadData();
setInterval(() => {if(state.view !== 'history') loadData();}, 5 * 60 * 1000);
</script>
</body>
</html>
